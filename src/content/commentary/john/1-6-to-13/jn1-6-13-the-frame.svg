<svg viewBox="0 0 1440 1170" xmlns="http://www.w3.org/2000/svg"
     role="img" aria-labelledby="frTitle frDesc" preserveAspectRatio="xMidYMid meet">
  <title id="frTitle">Where John 1:6–13 sits in the Prologue — outside the locked brackets, inside the held pair, on the third rung of the descent.</title>
  <desc id="frDesc">Where John 1:6–13 sits within the Prologue: the Foyer (vv. 1–5) on one side, the summit (vv. 14–18) on the other, the movement between them. Two solid brackets arch over the movement from outside it — v. 1 to v. 18, the "bosom" inclusio, and v. 3 to v. 18, the creator who exegetes the Father. The Foyer's inner pair, v. 4 to v. 14 — the life-and-light on one side, the glory beheld on the other — is drawn dashed and dimmed as the pair that encloses the movement, held open until 1:14. Barth's descending ladder is drawn as the same frame seen from the other side — four rungs: the Word with God, the Word and the world, the Word among men, the Word itself flesh — with these verses on the third rung, the Word among men; the descent is a framework, not the whole. The v. 1 / v. 10 form — three clauses joined by καί turning on one repeated noun, ἐν ἀρχῇ ἦν ὁ λόγος against ἐν τῷ κόσμῳ ἦν — is drawn in its form and its pairing dimmed as held.</desc>

  <style>
    /* --- family theming interface: light page renders from in-file fallbacks;
           dark slide renders when the host sets color / --color-gold / --color-meta / --color-goldtext --- */
    .gk    { font-family:'SBL BibLit','Cardo','Gentium Plus','Charis SIL','Source Serif 4',Georgia,serif; fill:currentColor; }
    .gkd   { font-family:'SBL BibLit','Cardo','Gentium Plus','Charis SIL','Source Serif 4',Georgia,serif; fill:var(--color-meta,#6b6b6b); }
    .ink   { font-family:'Source Serif 4','EB Garamond',Georgia,'Times New Roman',serif; fill:currentColor; }
    .inkb  { font-family:'Source Serif 4','EB Garamond',Georgia,'Times New Roman',serif; fill:currentColor; font-weight:600; }
    .desc  { font-family:'Source Serif 4','EB Garamond',Georgia,'Times New Roman',serif; fill:currentColor; font-style:italic; }
    .lbl   { font-family:'Source Serif 4','EB Garamond',Georgia,'Times New Roman',serif; fill:var(--color-meta,#6b6b6b); }
    .note  { font-family:'Source Serif 4','EB Garamond',Georgia,'Times New Roman',serif; fill:var(--color-meta,#6b6b6b); font-style:italic; }
    .glab  { font-family:'Source Serif 4','EB Garamond',Georgia,'Times New Roman',serif; fill:var(--color-goldtext,#8a6608); font-style:italic; }

    .panel { fill:none; stroke:currentColor; stroke-width:1.6; }
    .hair  { stroke:currentColor; stroke-width:1.4; fill:none; stroke-linecap:round; }
    .arcS  { stroke:var(--color-gold,#b8860b); stroke-width:2.6; fill:none; stroke-linecap:round; }
    .arcP  { stroke:var(--color-gold,#b8860b); stroke-width:2.2; fill:none; stroke-linecap:round; stroke-dasharray:7 6; opacity:0.6; }
    .rung  { stroke:currentColor; stroke-width:1.6; fill:none; stroke-linecap:round; }
    .rungM { stroke:var(--color-gold,#b8860b); stroke-width:3.4; fill:none; stroke-linecap:round; }
    .rail  { stroke:currentColor; stroke-width:1.6; fill:none; stroke-linecap:round; }
    .tick  { stroke:var(--color-gold,#b8860b); stroke-width:2.6; fill:none; stroke-linecap:round; }
    .node  { fill:var(--color-gold,#b8860b); }
    .pring { fill:none; stroke:var(--color-gold,#b8860b); stroke-width:2; opacity:0.6; }
  </style>

  <!-- ================= family title block ================= -->
  <text class="ink" x="720" y="50" text-anchor="middle" font-size="34" letter-spacing="0.5">The Frame — Between the Foyer and the Summit</text>
  <text class="lbl" x="720" y="82" text-anchor="middle" font-size="22">where John 1:6–13 sits in the Prologue · the same frame drawn from two sides</text>

  <!-- ================= the two solid brackets (locked), arching over the movement from feet outside it ================= -->
  <!-- v. 1 / v. 18 -->
  <path class="arcS" d="M100 430 C100 97 1345 97 1345 430"/>
  <text class="lbl" x="722" y="170" text-anchor="middle" font-size="21">v. 1 / v. 18 — the Word with God, the Son in the Father's bosom</text>
  <!-- v. 3 / v. 18 -->
  <path class="arcS" d="M180 430 C180 183 1345 183 1345 430"/>
  <text class="lbl" x="722" y="235" text-anchor="middle" font-size="21">v. 3 / v. 18 — the maker of all things makes him known</text>

  <!-- ================= the v. 4 / v. 14 pair (held): dashed and dimmed, enclosing the movement ================= -->
  <path class="arcP" d="M445 430 C445 277 985 277 985 430"/>
  <text class="lbl"  x="715" y="305" text-anchor="middle" font-size="21">v. 4 / v. 14 — the life and the light, the glory beheld</text>
  <text class="note" x="715" y="372" text-anchor="middle" font-size="21">the pair that encloses the movement</text>
  <text class="note" x="715" y="400" text-anchor="middle" font-size="21">completes at 1:14</text>

  <!-- bracket feet: filled = established, hollow = held -->
  <circle class="node"  cx="100"  cy="430" r="6"/>
  <circle class="node"  cx="180"  cy="430" r="6"/>
  <circle class="node"  cx="1345" cy="430" r="6"/>
  <circle class="pring" cx="445"  cy="430" r="7"/>
  <circle class="pring" cx="985"  cy="430" r="7"/>
  <text class="lbl" x="90"   y="455" text-anchor="start" font-size="21">v. 1</text>
  <text class="lbl" x="172"  y="455" text-anchor="start" font-size="21">v. 3</text>
  <text class="lbl" x="460"  y="455" text-anchor="end"   font-size="21">v. 4</text>
  <text class="lbl" x="998"  y="455" text-anchor="start" font-size="21">v. 14</text>
  <text class="lbl" x="1350" y="455" text-anchor="end"   font-size="21">v. 18</text>

  <!-- ================= the Prologue line: Foyer | the movement | the summit ================= -->
  <rect class="panel" x="80"  y="430" width="390" height="110" rx="4"/>
  <rect class="panel" x="500" y="430" width="460" height="110" rx="4"/>
  <rect class="panel" x="990" y="430" width="370" height="110" rx="4"/>

  <text class="lbl" x="275" y="495" text-anchor="middle" font-size="25">1:1–5</text>
  <text class="lbl" x="275" y="526" text-anchor="middle" font-size="21">the Foyer</text>

  <text class="inkb" x="730" y="493" text-anchor="middle" font-size="28">1:6–13</text>
  <text class="glab" x="730" y="532" text-anchor="middle" font-size="21">this unit</text>

  <text class="lbl" x="1175" y="495" text-anchor="middle" font-size="25">1:14–18</text>
  <text class="lbl" x="1175" y="526" text-anchor="middle" font-size="21">the summit</text>

  <text class="lbl" x="730" y="578" text-anchor="middle" font-size="21">the movement lies outside the two brackets and inside the held pair</text>

  <!-- ================= the same frame from the other side: the descending ladder ================= -->
  <text class="ink" x="80" y="655" text-anchor="start" font-size="22">Barth's descending ladder</text>
  <text class="lbl" x="80" y="683" text-anchor="start" font-size="21">the same frame, seen from the other side</text>

  <line class="rail" x1="140" y1="700" x2="140" y2="940"/>
  <line class="rail" x1="620" y1="700" x2="620" y2="940"/>

  <line class="rung"  x1="140" y1="730" x2="620" y2="730"/>
  <text class="ink" x="380" y="722" text-anchor="middle" font-size="22">the Word with God</text>

  <line class="rung"  x1="140" y1="800" x2="620" y2="800"/>
  <text class="ink" x="380" y="792" text-anchor="middle" font-size="22">the Word and the world</text>

  <line class="rungM" x1="140" y1="870" x2="620" y2="870"/>
  <circle class="node" cx="140" cy="870" r="5.5"/>
  <circle class="node" cx="620" cy="870" r="5.5"/>
  <text class="inkb" x="380" y="862" text-anchor="middle" font-size="22">the Word among men</text>
  <text class="glab" x="604" y="862" text-anchor="end" font-size="21">1:6–13</text>

  <line class="rung"  x1="140" y1="940" x2="620" y2="940"/>
  <text class="ink" x="380" y="932" text-anchor="middle" font-size="22">the Word itself flesh</text>

  <text class="lbl"  x="380" y="1024" text-anchor="middle" font-size="21">these verses on the third rung · this commentary's placement</text>
  <text class="note" x="380" y="1050" text-anchor="middle" font-size="21">the descent is a framework, not the whole</text>

  <!-- ================= one form, at two verses: the form drawn, the pairing held ================= -->
  <text class="ink" x="760" y="655" text-anchor="start" font-size="22">One form, at verse 1 and at verse 10</text>
  <text class="lbl" x="760" y="683" text-anchor="start" font-size="21">three clauses joined by <tspan class="gkd">καί</tspan>, turning on one repeated noun</text>

  <text class="lbl" x="900"  y="712" text-anchor="middle" font-size="21">verse 1</text>
  <text class="lbl" x="1230" y="712" text-anchor="middle" font-size="21">verse 10</text>

  <rect class="panel" x="780"  y="724" width="240" height="210" rx="4"/>
  <rect class="panel" x="1110" y="724" width="240" height="210" rx="4"/>

  <text class="gk" x="900"  y="768" text-anchor="middle" font-size="24">ἐν ἀρχῇ ἦν ὁ λόγος</text>
  <text class="gk" x="1230" y="768" text-anchor="middle" font-size="24">ἐν τῷ κόσμῳ ἦν</text>

  <text class="lbl" x="900"  y="800" text-anchor="middle" font-size="21">three clauses</text>
  <text class="lbl" x="1230" y="800" text-anchor="middle" font-size="21">three clauses</text>

  <circle class="node" cx="835" cy="816" r="4"/>
  <circle class="node" cx="835" cy="838" r="4"/>
  <circle class="node" cx="835" cy="860" r="4"/>
  <circle class="node" cx="1165" cy="816" r="4"/>
  <circle class="node" cx="1165" cy="838" r="4"/>
  <circle class="node" cx="1165" cy="860" r="4"/>
  <line class="tick" x1="835"  y1="816" x2="965"  y2="816"/>
  <line class="tick" x1="835"  y1="838" x2="965"  y2="838"/>
  <line class="tick" x1="835"  y1="860" x2="965"  y2="860"/>
  <line class="tick" x1="1165" y1="816" x2="1295" y2="816"/>
  <line class="tick" x1="1165" y1="838" x2="1295" y2="838"/>
  <line class="tick" x1="1165" y1="860" x2="1295" y2="860"/>

  <text class="lbl" x="900"  y="892" text-anchor="middle" font-size="21">the repeated noun</text>
  <text class="lbl" x="1230" y="892" text-anchor="middle" font-size="21">the repeated noun</text>
  <text class="gk"  x="900"  y="922" text-anchor="middle" font-size="24">ὁ λόγος</text>
  <text class="gk"  x="1230" y="922" text-anchor="middle" font-size="24">ὁ κόσμος</text>

  <!-- the pairing: dashed and dimmed, hollow ring terminals — the anchor's held token -->
  <path class="arcP" d="M900 934 C900 1010 1230 1010 1230 934"/>
  <circle class="pring" cx="900"  cy="934" r="7"/>
  <circle class="pring" cx="1230" cy="934" r="7"/>
  <text class="lbl"  x="1065" y="1024" text-anchor="middle" font-size="21">whether the one was composed to answer the other</text>
  <text class="note" x="1065" y="1050" text-anchor="middle" font-size="21">the form is settled · the pairing is held open</text>

  <!-- ================= synthesis ================= -->
  <text class="desc" x="720" y="1130" text-anchor="middle" font-size="22">A frame, not a coupling — and the second movement presupposes a third, treated at 1:14–18.</text>
</svg>
