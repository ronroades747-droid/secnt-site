<svg viewBox="0 0 1440 1000" xmlns="http://www.w3.org/2000/svg"
     role="img" aria-labelledby="fcTitle fcDesc" preserveAspectRatio="xMidYMid meet">
  <title id="fcTitle">The Prologue's frame closing in v. 18: two brackets closing at their far pole, the θεός inclusio, an echo inside the frame, and the hinge left open.</title>
  <desc id="fcDesc">The Prologue's frame closing in v. 18. Two solid brackets arch over the whole Prologue to their far pole: v. 1 to v. 18, the bosom of the Father in v. 18 rendering "with God" in v. 1; and v. 3 to v. 18, the creator and the one who makes God known. The θεός inclusio — θεὸς ἦν ὁ λόγος (v. 1) and μονογενὴς θεός (v. 18) — is drawn solid. Inside the frame, v. 3 and v. 17 are drawn as a lighter echo at ἐγένετο, not a third bracket: all things came to be through him; the grace and the truth came to be through Jesus Christ. The frame's hinge, v. 1 to v. 14 — the Word who was God, the Word become flesh — is drawn dashed and dimmed and labelled as a question still to be settled. The figure has no centre and no fold.</desc>
  <style>
    /* --- family theming interface: light page renders from in-file fallbacks;
           dark slide renders when the host sets color / --color-gold / --color-meta / --color-goldtext --- */
    .gk    { font-family:'SBL BibLit','Cardo','Gentium Plus','Charis SIL','Source Serif 4',Georgia,serif; fill:currentColor; }
    .gkd   { font-family:'SBL BibLit','Cardo','Gentium Plus','Charis SIL','Source Serif 4',Georgia,serif; fill:var(--color-meta,#6b6b6b); }
    .ink   { font-family:'Source Serif 4','EB Garamond',Georgia,'Times New Roman',serif; fill:currentColor; }
    .inkb  { font-family:'Source Serif 4','EB Garamond',Georgia,'Times New Roman',serif; fill:currentColor; font-weight:600; }
    .desc  { font-family:'Source Serif 4','EB Garamond',Georgia,'Times New Roman',serif; fill:currentColor; font-style:italic; }
    .lbl   { font-family:'Source Serif 4','EB Garamond',Georgia,'Times New Roman',serif; fill:var(--color-meta,#6b6b6b); }
    .note  { font-family:'Source Serif 4','EB Garamond',Georgia,'Times New Roman',serif; fill:var(--color-meta,#6b6b6b); font-style:italic; }
    .glab  { font-family:'Source Serif 4','EB Garamond',Georgia,'Times New Roman',serif; fill:var(--color-goldtext,#8a6608); font-style:italic; }
    .panel { fill:none; stroke:currentColor; stroke-width:1.6; }
    .arcS  { stroke:var(--color-gold,#b8860b); stroke-width:2.6; fill:none; stroke-linecap:round; }
    .arcP  { stroke:var(--color-gold,#b8860b); stroke-width:2.2; fill:none; stroke-linecap:round; stroke-dasharray:7 6; opacity:0.6; }
    .arcI  { stroke:currentColor; stroke-width:2; fill:none; stroke-linecap:round; }
    .arcE  { stroke:var(--color-meta,#6b6b6b); stroke-width:1.4; fill:none; stroke-linecap:round; }
    .node  { fill:var(--color-gold,#b8860b); }
    .nodei { fill:currentColor; }
    .noded { fill:var(--color-meta,#6b6b6b); }
    .pring { fill:none; stroke:var(--color-gold,#b8860b); stroke-width:2; opacity:0.6; }
  </style>

  <!-- ================= family title block ================= -->
  <text class="ink" x="720" y="50" text-anchor="middle" font-size="34" letter-spacing="0.5">The Frame Completed</text>
  <text class="lbl" x="720" y="82" text-anchor="middle" font-size="22">the Prologue's frame closing in v. 18 · its last verse answering its first</text>

  <!-- the two locked brackets, solid, arching over the whole Prologue to their far pole -->
  <path class="arcS" d="M110 470 C110 70 1330 70 1330 470"/>
  <text class="lbl" x="720" y="158" text-anchor="middle" font-size="21">v. 1 / v. 18 — the Word with God, the Son in the Father's bosom</text>
  <text class="gkd" x="720" y="204" text-anchor="middle" font-size="22">πρὸς τὸν θεόν · εἰς τὸν κόλπον τοῦ πατρός</text>
  <path class="arcS" d="M200 470 C200 190 1330 190 1330 470"/>
  <text class="lbl" x="765" y="248" text-anchor="middle" font-size="21">v. 3 / v. 18 — the creator and the exegete</text>

  <!-- the echo inside the frame, lighter, not a bracket -->
  <path class="arcE" d="M200 470 C250 320 1130 320 1180 470"/>
  <text class="lbl" x="690" y="334" text-anchor="middle" font-size="21">v. 3 / v. 17 — an echo at <tspan class="gkd">ἐγένετο</tspan>, not a third bracket</text>
  <text class="note" x="690" y="398" text-anchor="middle" font-size="21">all things came to be through him;</text>
  <text class="note" x="690" y="426" text-anchor="middle" font-size="21">the grace and the truth came to be through Jesus Christ</text>
  <circle class="noded" cx="1180" cy="470" r="5"/>

  <!-- bracket feet: filled = established; the far pole in this movement's last verse -->
  <circle class="node" cx="110"  cy="470" r="6"/>
  <circle class="node" cx="200"  cy="470" r="6"/>
  <circle class="node" cx="1330" cy="470" r="6"/>
  <text class="glab" x="1318" y="452" text-anchor="end" font-size="21">the far pole</text>

  <!-- the Prologue line -->
  <rect class="panel" x="80"  y="470" width="390" height="110" rx="4"/>
  <rect class="panel" x="500" y="470" width="300" height="110" rx="4"/>
  <rect class="panel" x="830" y="470" width="530" height="110" rx="4"/>
  <text class="lbl" x="98"   y="500" text-anchor="start" font-size="21">v. 1</text>
  <text class="lbl" x="200"  y="500" text-anchor="middle" font-size="21">v. 3</text>
  <text class="lbl" x="870"  y="500" text-anchor="middle" font-size="21">v. 14</text>
  <text class="lbl" x="1180" y="500" text-anchor="middle" font-size="21">v. 17</text>
  <text class="lbl" x="1344" y="500" text-anchor="end" font-size="21">v. 18</text>
  <text class="lbl"  x="275"  y="552" text-anchor="middle" font-size="25">1:1–5</text>
  <text class="lbl"  x="650"  y="552" text-anchor="middle" font-size="25">1:6–13</text>
  <text class="inkb" x="1030" y="552" text-anchor="middle" font-size="28">1:14–18</text>
  <text class="glab" x="1165" y="552" text-anchor="start" font-size="21">this unit</text>

  <!-- ================= beneath the line: v. 1c answered twice ================= -->
  <text class="gk" x="87" y="636" text-anchor="start" font-size="24">θεὸς ἦν ὁ λόγος</text>
  <text class="gk" x="870" y="636" text-anchor="middle" font-size="24">ὁ λόγος σὰρξ ἐγένετο</text>
  <text class="gk" x="1353" y="636" text-anchor="end" font-size="24">μονογενὴς θεός</text>

  <!-- the hinge, dashed and dimmed -->
  <path class="arcP" d="M212 656 C212 740 870 740 870 656"/>
  <circle class="pring" cx="212" cy="656" r="7"/>
  <circle class="pring" cx="870" cy="656" r="7"/>
  <text class="lbl" x="560" y="752" text-anchor="middle" font-size="21">v. 1 / v. 14 — the Word who was God, the Word become flesh</text>
  <text class="note" x="560" y="778" text-anchor="middle" font-size="21">the frame's hinge · a question still to be settled</text>

  <!-- the θεός inclusio, solid -->
  <path class="arcI" d="M110 656 C110 920 1330 920 1330 656"/>
  <circle class="nodei" cx="110" cy="656" r="5.5"/>
  <circle class="nodei" cx="1330" cy="656" r="5.5"/>
  <text class="lbl" x="720" y="886" text-anchor="middle" font-size="21">the <tspan class="gkd">θεός</tspan> inclusio — <tspan class="gkd">θεός</tspan> in the first verse and in the last</text>
  <text class="note" x="720" y="914" text-anchor="middle" font-size="21">a figure of the received text</text>

  <!-- ================= synthesis ================= -->
  <text class="desc" x="720" y="976" text-anchor="middle" font-size="22">The frame closes in its last verse — the end answers the beginning, with an echo inside it and its hinge still to be settled.</text>
</svg>
