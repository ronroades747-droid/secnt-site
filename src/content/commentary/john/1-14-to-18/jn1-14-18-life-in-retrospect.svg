<svg viewBox="0 0 1440 1080" xmlns="http://www.w3.org/2000/svg"
     role="img" aria-labelledby="lrTitle lrDesc" preserveAspectRatio="xMidYMid meet">
  <title id="lrTitle">The temporal plan of John 1:14–18: one retrospect from the completed life, broken twice.</title>
  <desc id="lrDesc">The temporal plan of John 1:14–18 on the verse line. The frame is one retrospect from the completed life: the aorists from σὰρξ ἐγένετο to ἐξηγήσατο, each gathering its span into one completed fact, headed by ἐγένετο, one becoming, with ἐσκήνωσεν explicating its breadth. Two breaks are drawn as two different marks. At v. 15 the present μαρτυρεῖ and the perfect κέκραγεν are the one arrow that leaves the past frame toward the reader's day. At v. 18 the perfect ἑώρακεν with πώποτε and the participle ὁ ὤν stand above the line, outside narrative time, not toward the reader. On the spine, v. 14's ἐγένετο stands against v. 1's ἦν; v. 17's ἐγένετο names the same event at its gift; ὁ ὤν answers v. 1's ἦν and is drawn off the spine; v. 15's γέγονεν is marked at its clause and not on the spine. The three parts are laid over the treads, the joint and the break coinciding at the witness, and the crown and the second break coinciding at v. 18.</desc>

  <style>
    /* --- family theming interface: light page renders from in-file fallbacks;
           dark slide renders when the host sets color / --color-gold / --color-meta / --color-goldtext --- */
    .gk    { font-family:'SBL BibLit','Cardo','Gentium Plus','Charis SIL','Source Serif 4',Georgia,serif; fill:currentColor; }
    .gkd   { font-family:'SBL BibLit','Cardo','Gentium Plus','Charis SIL','Source Serif 4',Georgia,serif; fill:var(--color-meta,#6b6b6b); }
    .ink   { font-family:'Source Serif 4','EB Garamond',Georgia,'Times New Roman',serif; fill:currentColor; }
    .inkb  { font-family:'Source Serif 4','EB Garamond',Georgia,'Times New Roman',serif; fill:currentColor; font-weight:600; }
    .desc  { font-family:'Source Serif 4','EB Garamond',Georgia,'Times New Roman',serif; fill:currentColor; font-style:italic; }
    .lbl   { font-family:'Source Serif 4','EB Garamond',Georgia,'Times New Roman',serif; fill:var(--color-meta,#6b6b6b); }
    .note  { font-family:'Source Serif 4','EB Garamond',Georgia,'Times New Roman',serif; fill:var(--color-meta,#6b6b6b); font-style:italic; }

    .band  { fill:none; stroke:currentColor; stroke-width:1.6; }
    .seam  { stroke:var(--color-gold,#b8860b); stroke-width:3.4; fill:none; }
    .joint { stroke:var(--color-meta,#6b6b6b); stroke-width:1.6; fill:none; }
    .arc   { stroke:var(--color-gold,#b8860b); stroke-width:2.6; fill:none; stroke-linecap:round; stroke-linejoin:round; }
    .stand { stroke:var(--color-gold,#b8860b); stroke-width:2.6; fill:none; stroke-linecap:butt; }
    .cap   { stroke:var(--color-gold,#b8860b); stroke-width:3.4; fill:none; stroke-linecap:butt; }
    .rise  { stroke:var(--color-gold,#b8860b); stroke-width:1.4; fill:none; stroke-linecap:round; }
    .spine { stroke:var(--color-gold,#b8860b); stroke-width:2.6; fill:none; stroke-linecap:butt; }
    .rule  { stroke:var(--color-gold,#b8860b); stroke-width:2.4; fill:none; stroke-linecap:round; }
    .node  { fill:var(--color-gold,#b8860b); }
    .noded { fill:var(--color-meta,#6b6b6b); }
    .brk   { stroke:var(--color-meta,#6b6b6b); stroke-width:1.4; fill:none; }
    .guide { stroke:var(--color-meta,#6b6b6b); stroke-width:1; fill:none; }
  </style>

  <defs>
    <marker id="lr-arrow" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--color-gold,#b8860b)"/>
    </marker>
  </defs>

  <!-- ================= family title block ================= -->
  <text class="ink" x="720" y="50" text-anchor="middle" font-size="34" letter-spacing="0.5">The Incarnate Life Told in Retrospect</text>
  <text class="lbl" x="720" y="82" text-anchor="middle" font-size="22">the temporal plan of John 1:14–18 · one retrospect from the completed life, broken twice</text>

  <!-- ================= the second break: v. 18, a capped stem standing above the frame, no arrowhead ================= -->
  <text class="gk" x="1195" y="132" text-anchor="middle" font-size="24">ἑώρακεν πώποτε · ὁ ὤν</text>
  <line class="cap" x1="1125" y1="150" x2="1265" y2="150"/>
  <line class="stand" x1="1195" y1="150" x2="1195" y2="470"/>
  <text class="lbl"  x="1160" y="182" text-anchor="end" font-size="21">the second break · outside narrative time, not toward the reader</text>
  <text class="note" x="1160" y="210" text-anchor="end" font-size="21"><tspan class="gkd">ὁ ὤν</tspan> answers v. 1's <tspan class="gkd">ἦν</tspan> — drawn off the spine</text>

  <!-- ================= the frame: one retrospect from the completed life ================= -->
  <path class="arc" d="M 330 300 L 330 250 L 1380 250 L 1380 300"/>
  <text class="lbl"  x="760" y="290" text-anchor="middle" font-size="21">the frame · one retrospect from the completed life</text>
  <text class="note" x="760" y="316" text-anchor="middle" font-size="21">each aorist gathers its span into one completed fact</text>

  <!-- ================= the head, and the six frame aorists on the line ================= -->
  <text class="lbl" x="412" y="352" text-anchor="middle" font-size="21">the head · one becoming, the dwelling its breadth</text>
  <path class="brk" d="M 262 378 L 262 370 L 548 370 L 548 378"/>
  <text class="gk" x="330" y="404" text-anchor="middle" font-size="24">σὰρξ ἐγένετο</text>
  <text class="gk" x="480" y="404" text-anchor="middle" font-size="24">ἐσκήνωσεν</text>
  <text class="gk" x="585" y="446" text-anchor="middle" font-size="24">ἐθεασάμεθα</text>
  <text class="gk" x="925" y="404" text-anchor="middle" font-size="24">ἐλάβομεν</text>
  <text class="gk" x="1075" y="404" text-anchor="middle" font-size="24">ἐγένετο</text>
  <text class="gk" x="1300" y="404" text-anchor="middle" font-size="24">ἐξηγήσατο</text>
  <line class="rise" x1="330"  y1="418" x2="330"  y2="464"/>
  <line class="rise" x1="480"  y1="418" x2="480"  y2="464"/>
  <line class="rise" x1="585"  y1="458" x2="585"  y2="464"/>
  <line class="rise" x1="925"  y1="418" x2="925"  y2="464"/>
  <line class="rise" x1="1075" y1="418" x2="1075" y2="464"/>
  <line class="rise" x1="1300" y1="418" x2="1300" y2="464"/>
  <circle class="node" cx="330"  cy="470" r="5.5"/>
  <circle class="node" cx="480"  cy="470" r="5.5"/>
  <circle class="node" cx="585"  cy="470" r="5.5"/>
  <circle class="node" cx="925"  cy="470" r="5.5"/>
  <circle class="node" cx="1075" cy="470" r="5.5"/>
  <circle class="node" cx="1300" cy="470" r="5.5"/>
  <circle class="node" cx="1195" cy="470" r="5.5"/>

  <!-- ================= the verse line, with the three parts laid over the treads ================= -->
  <rect class="band" x="230" y="470" width="1150" height="120" rx="4"/>
  <line class="seam"  x1="640"  y1="470" x2="640"  y2="590"/>
  <line class="seam"  x1="850"  y1="470" x2="850"  y2="590"/>
  <line class="joint" x1="1000" y1="530" x2="1000" y2="590"/>
  <line class="joint" x1="1150" y1="530" x2="1150" y2="590"/>
  <text class="ink" x="435"  y="518" text-anchor="middle" font-size="25">the confession</text>
  <text class="ink" x="745"  y="518" text-anchor="middle" font-size="25">the witness</text>
  <text class="ink" x="1115" y="518" text-anchor="middle" font-size="25">the ground and the declaration</text>
  <text class="lbl"  x="435"  y="568" text-anchor="middle" font-size="22">v. 14</text>
  <text class="lbl"  x="745"  y="568" text-anchor="middle" font-size="22">v. 15</text>
  <text class="lbl"  x="925"  y="568" text-anchor="middle" font-size="22">v. 16</text>
  <text class="lbl"  x="1075" y="568" text-anchor="middle" font-size="22">v. 17</text>
  <text class="inkb" x="1265" y="566" text-anchor="middle" font-size="22">v. 18</text>
  <line class="rule" x1="1238" y1="577" x2="1292" y2="577"/>

  <!-- ================= the two coincidences ================= -->
  <text class="note" x="705"  y="632" text-anchor="end" font-size="21">the joint and the break coincide at the witness</text>
  <text class="note" x="1378" y="632" text-anchor="end" font-size="21">the crown and the second break coincide</text>

  <!-- ================= the first break: v. 15, the aperture, the one arrow that leaves ================= -->
  <circle class="node" cx="745" cy="590" r="5.5"/>
  <line class="rise" x1="745" y1="596" x2="745" y2="652"/>
  <text class="gk"  x="745" y="682" text-anchor="middle" font-size="24">μαρτυρεῖ · κέκραγεν</text>
  <text class="lbl" x="745" y="710" text-anchor="middle" font-size="21">the first break · the present and the perfect</text>
  <path class="arc" d="M 862 676 C 1060 690, 1290 742, 1396 800" marker-end="url(#lr-arrow)"/>
  <line class="guide" x1="1380" y1="660" x2="1380" y2="820"/>
  <text class="lbl"  x="1400" y="846" text-anchor="end" font-size="21">toward the reader's day</text>
  <text class="note" x="1400" y="872" text-anchor="end" font-size="21">a witness that still sounds</text>

  <!-- ================= γέγονεν at its clause, off the spine ================= -->
  <circle class="noded" cx="745" cy="908" r="5"/>
  <text class="gkd" x="725" y="914" text-anchor="end" font-size="22">γέγονεν</text>
  <text class="note" x="765" y="914" text-anchor="start" font-size="21">at its clause, a resulting state — not on the spine</text>

  <!-- ================= the tense-spine at its close (the unit's left edge continued as a hairline) ================= -->
  <line class="guide" x1="230" y1="610" x2="230" y2="960"/>
  <text class="note" x="250" y="934" text-anchor="start" font-size="21">the Prologue's tense-spine, at its close</text>
  <line class="spine" x1="70" y1="952" x2="1380" y2="952"/>
  <line class="rule" x1="1380" y1="942" x2="1380" y2="962"/>
  <circle class="node" cx="110"  cy="952" r="5.5"/>
  <circle class="node" cx="330"  cy="952" r="5.5"/>
  <circle class="node" cx="1075" cy="952" r="5.5"/>
  <text class="gk"  x="110"  y="984" text-anchor="middle" font-size="24">ἦν</text>
  <text class="gk"  x="330"  y="984" text-anchor="middle" font-size="24">ἐγένετο</text>
  <text class="gk"  x="1075" y="984" text-anchor="middle" font-size="24">ἐγένετο</text>
  <text class="lbl" x="110"  y="1010" text-anchor="middle" font-size="21">v. 1</text>
  <text class="lbl" x="330"  y="1010" text-anchor="middle" font-size="21">v. 14 · against v. 1's <tspan class="gkd">ἦν</tspan></text>
  <text class="lbl" x="1075" y="1010" text-anchor="middle" font-size="21">v. 17 · the same event, at its gift</text>

  <!-- ================= synthesis ================= -->
  <text class="desc" x="720" y="1060" text-anchor="middle" font-size="22">The incarnate life told from its completion — broken by a witness that still sounds, and by a truth outside narrative time.</text>
</svg>
