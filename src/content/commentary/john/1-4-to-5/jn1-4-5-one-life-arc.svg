<svg viewBox="0 0 1440 810" xmlns="http://www.w3.org/2000/svg"
     role="img" aria-labelledby="olTitle olDesc" preserveAspectRatio="xMidYMid meet">
  <title id="olTitle">The one divine life of John 1:4–5 traced as a single arc — in the Word, the light of men, shining within the darkness, unovercome — reaching from creation toward consummation, and reaching within the Prologue as far as the glory beheld at 1:14.</title>
  <desc id="olDesc">The four theological movements of John 1:4–5 are gathered into a single arc: the life in the Word (ζωὴ ἦν, verse 4a), the light of men (τὸ φῶς τῶν ἀνθρώπων, verse 4b), the light shining within the darkness (ἐν τῇ σκοτίᾳ φαίνει, verse 5a), and the darkness that does not overcome it (οὐ κατέλαβεν, verse 5b). Gathered into one, they trace a single life from creation — the protological pole at verse 4a — toward consummation, the eternal life (ζωὴ αἰώνιος), the eschatological pole. The solid span of the arc, from verse 4a to verse 5b, is established. The dashed reach beyond it runs to verse 14, the furthest point the Prologue itself reaches: the incarnation, where the light of verse 4 is beheld as glory. That verse 14 point is drawn as a hollow ring and marked provisional, because the arc does not close there — its end is consummation, and the eternal life is named as the pole beyond, toward which the open arrow continues.</desc>

  <style>
    /* family theming interface — light page from in-file fallbacks; dark slide when the host sets tokens */
    .gk    { font-family:'SBL BibLit','Cardo','Gentium Plus','Charis SIL','Source Serif 4',Georgia,serif; fill:currentColor; }
    .ink   { font-family:'Source Serif 4','EB Garamond',Georgia,'Times New Roman',serif; fill:currentColor; }
    .lbl   { font-family:'Source Serif 4','EB Garamond',Georgia,'Times New Roman',serif; fill:var(--color-meta,#6b6b6b); }
    .note  { font-family:'Source Serif 4','EB Garamond',Georgia,'Times New Roman',serif; fill:var(--color-meta,#6b6b6b); font-style:italic; }
    .head  { font-family:'Source Serif 4','EB Garamond',Georgia,'Times New Roman',serif; fill:var(--color-goldtext,#8a6608); letter-spacing:0.16em; }
    .thr   { fill:var(--color-goldtext,#8a6608); font-style:italic; }

    .arc   { stroke:var(--color-gold,#b8860b); stroke-width:2.8; fill:none; stroke-linecap:round; stroke-linejoin:round; }
    .arcp  { stroke:var(--color-gold,#b8860b); stroke-width:2.6; fill:none; stroke-linecap:round; stroke-dasharray:9 10; }
    .arcd  { stroke:var(--color-meta,#6b6b6b); stroke-width:1.8; fill:none; stroke-linecap:round; stroke-dasharray:3 8; }
    .node  { fill:var(--color-gold,#b8860b); }
    .pole  { fill:var(--color-gold,#b8860b); }
    .gring { fill:none; stroke:currentColor; stroke-width:1.8; }
    .tick  { stroke:var(--color-gold,#b8860b); stroke-width:1.2; fill:none; }
  </style>

  <defs>
    <marker id="ol-open" viewBox="0 0 10 10" refX="7" refY="5"
            markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="var(--color-meta,#6b6b6b)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- ================= title block ================= -->
  <text class="ink"  x="90" y="76"  font-size="36">The One-Life Arc</text>
  <text class="lbl"  x="90" y="110" font-size="22">John 1:4–5 · the four theological movements gathered into one</text>

  <!-- ================= the one-life arc ================= -->
  <!-- solid / established span: v.4a through v.5b -->
  <path class="arc" d="M165,540 C 275,445 370,402 455,395 C 565,386 640,360 730,355 C 845,349 930,385 1000,445"/>
  <!-- provisional dashed reach to the v.14 within-volume terminus -->
  <path class="arcp" d="M1000,445 C 1062,500 1120,532 1175,540"/>
  <!-- the eschatological pole beyond (dim, open) -->
  <path class="arcd" d="M1198,538 L 1398,516" marker-end="url(#ol-open)"/>

  <!--  creation / the life in the Word (v.4a)  -->
  <circle class="pole" cx="165" cy="540" r="10"/>
  <text class="ink"  x="165" y="452" text-anchor="middle" font-size="24">the life <tspan class="thr">in</tspan> the Word</text>
  <text class="gk"   x="165" y="492" text-anchor="middle" font-size="28">ζωὴ ἦν</text>
  <text class="lbl"  x="165" y="588" text-anchor="middle" font-size="21">creation · v. 4a</text>

  <!--  the light of men (v.4b)  -->
  <circle class="node" cx="455" cy="395" r="9"/>
  <text class="ink"  x="455" y="307" text-anchor="middle" font-size="24">the light <tspan class="thr">of</tspan> men</text>
  <text class="gk"   x="455" y="347" text-anchor="middle" font-size="28">τὸ φῶς τῶν ἀνθρώπων</text>
  <text class="lbl"  x="455" y="443" text-anchor="middle" font-size="21">v. 4b</text>

  <!--  shining within the darkness (v.5a)  -->
  <circle class="node" cx="730" cy="355" r="9"/>
  <text class="ink"  x="730" y="267" text-anchor="middle" font-size="24">shining <tspan class="thr">within</tspan> the darkness</text>
  <text class="gk"   x="730" y="307" text-anchor="middle" font-size="28">ἐν τῇ σκοτίᾳ φαίνει</text>
  <text class="lbl"  x="730" y="403" text-anchor="middle" font-size="21">v. 5a</text>

  <!--  the darkness unovercome (v.5b)  -->
  <circle class="node" cx="1000" cy="445" r="9"/>
  <text class="ink"  x="1000" y="357" text-anchor="middle" font-size="24">the darkness cannot master it</text>
  <text class="gk"   x="1000" y="397" text-anchor="middle" font-size="28">οὐ κατέλαβεν</text>
  <text class="lbl"  x="1000" y="493" text-anchor="middle" font-size="21">v. 5b</text>

  <!--  the eschatological pole, above the open reach  -->
  <text class="gk"   x="1420" y="448" text-anchor="end" font-size="26">ζωὴ αἰώνιος</text>
  <text class="lbl"  x="1420" y="480" text-anchor="end" font-size="21">consummation</text>

  <!--  the v.14 within-volume terminus (provisional: hollow ring), labelled below  -->
  <circle class="gring" cx="1175" cy="540" r="16"/>
  <text class="lbl"  x="1175" y="592" text-anchor="middle" font-size="21">v. 14 · the incarnation</text>
  <text class="note" x="1175" y="622" text-anchor="middle" font-size="21">the arc does not close here</text>

  <!-- ================= the integrative gathering (one life) ================= -->
  <path class="tick" d="M165,680 L165,688 L1000,688 L1000,680"/>
  <text class="head" x="582" y="722" text-anchor="middle" font-size="21">ONE LIFE — THE FOUR GATHERED INTO A SINGLE ARC</text>

  <!-- ================= movement summary ================= -->
  <text class="note" x="720" y="772" text-anchor="middle" font-size="21">one life — in the Word, of men, within the darkness, unovercome — from creation toward consummation</text>
</svg>
