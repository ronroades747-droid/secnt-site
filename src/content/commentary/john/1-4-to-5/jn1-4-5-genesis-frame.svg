<svg viewBox="0 0 1440 920" xmlns="http://www.w3.org/2000/svg"
     role="img" aria-labelledby="gfTitle gfDesc" preserveAspectRatio="xMidYMid meet">
  <title id="gfTitle">The Genesis frame — Genesis 1:1–5 read in the key of the Word, its creation-light and primeval darkness transposed across John 1:4–5.</title>
  <desc id="gfDesc">John 1:4–5 reads the opening of Genesis in the key of the Word. Within a frame of Genesis 1:1–5 that the evangelist has kept open since verse 1, three terms of the creation account are carried across into John's unit: the creation-light of Genesis 1 becomes the light of men in the Word (τὸ φῶς τῶν ἀνθρώπων); the primeval darkness over the deep becomes a darkness set against God (ἡ σκοτία); and the light that God calls into being now shines in the present (φαίνει). Genesis 1's shared light, darkness, and shine vocabulary is registered throughout. A band beneath the frame marks John 1:4–5 as the third sustained engagement with Genesis 1:1–5 in the space of five verses, after 1:1 and 1:3.</desc>

  <style>
    /* --- family theming interface: light page renders from in-file fallbacks;
           dark slide renders when the host sets color / --color-gold / --color-meta --- */
    .gk    { font-family:'SBL BibLit','Cardo','Gentium Plus','Charis SIL','Source Serif 4',Georgia,serif; fill:currentColor; }
    .ink   { font-family:'Source Serif 4','EB Garamond',Georgia,'Times New Roman',serif; fill:currentColor; }
    .lbl   { font-family:'Source Serif 4','EB Garamond',Georgia,'Times New Roman',serif; fill:var(--color-meta,#6b6b6b); }
    .note  { font-family:'Source Serif 4','EB Garamond',Georgia,'Times New Roman',serif; fill:var(--color-meta,#6b6b6b); font-style:italic; }
    .head  { font-family:'Source Serif 4','EB Garamond',Georgia,'Times New Roman',serif; fill:var(--color-goldtext,#8a6608); letter-spacing:0.14em; }
    .field { font-family:'Source Serif 4','EB Garamond',Georgia,'Times New Roman',serif; fill:var(--color-goldtext,#8a6608); letter-spacing:0.2em; }

    .frame { stroke:var(--color-gold,#b8860b); stroke-width:2.4; fill:none; stroke-linecap:round; stroke-linejoin:round; }
    .cross { stroke:var(--color-gold,#b8860b); stroke-width:3.2; fill:none; stroke-linecap:round; }
    .axis  { stroke:var(--color-meta,#6b6b6b); stroke-width:1.6; fill:none; stroke-linecap:round; }
    .node  { fill:var(--color-gold,#b8860b); }
    .gring { fill:none; stroke:var(--color-gold,#b8860b); stroke-width:2; }
    .gnode { fill:var(--color-gold,#b8860b); }
    .brk   { stroke:var(--color-meta,#6b6b6b); stroke-width:1; fill:none; }
  </style>

  <defs>
    <marker id="gf-arrow" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="8.5" markerHeight="8.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--color-gold,#b8860b)"/>
    </marker>
  </defs>

  <!-- ============ title block (family form; min-21 re-author, 26 Aug 2026) ============ -->
  <text class="ink" x="90" y="74"  font-size="36">The Genesis Frame</text>
  <text class="lbl" x="90" y="108" font-size="22">John 1:4–5 · the creation account read in the key of the Word</text>

  <!-- ================= the Genesis frame (kept open since 1:1) ================= -->
  <text class="head" x="720" y="150" text-anchor="middle" font-size="21">GENESIS 1:1–5 · KEPT OPEN SINCE 1:1</text>
  <rect class="frame" x="70" y="170" width="1300" height="584" rx="6"/>
  <text class="note" x="720" y="212" text-anchor="middle" font-size="21">the frame that conditions the whole unit</text>

  <!-- ================= column headers ================= -->
  <text class="head" x="330"  y="262" text-anchor="middle" font-size="21">THE CREATION ACCOUNT</text>
  <text class="lbl"  x="330"  y="292" text-anchor="middle" font-size="21">Genesis 1 · the light and the dark of the beginning</text>
  <text class="head" x="1095" y="262" text-anchor="middle" font-size="21">IN THE WORD</text>
  <text class="lbl"  x="1095" y="292" text-anchor="middle" font-size="21">John 1:4–5 · the same terms, read christologically</text>

  <!-- ================= transposition rows ================= -->
  <!-- Row 1 — LIGHT (baseline ~ 386) -->
  <text class="ink"  x="330" y="386" text-anchor="middle" font-size="26">the creation-light</text>
  <text class="note" x="330" y="414" text-anchor="middle" font-size="21">the light God calls into being</text>
  <line class="cross" x1="560" y1="386" x2="838" y2="386" marker-end="url(#gf-arrow)"/>
  <text class="field" x="695" y="369" text-anchor="middle" font-size="21">LIGHT</text>
  <text class="gk"   x="1095" y="384" text-anchor="middle" font-size="30">τὸ φῶς τῶν ἀνθρώπων</text>
  <text class="note" x="1095" y="414" text-anchor="middle" font-size="21">now the light <tspan font-style="italic">of men</tspan>, in the Word</text>

  <!-- Row 2 — DARKNESS (baseline ~ 521) -->
  <text class="ink"  x="330" y="521" text-anchor="middle" font-size="26">the primeval darkness</text>
  <text class="note" x="330" y="549" text-anchor="middle" font-size="21">the dark over the deep</text>
  <line class="cross" x1="560" y1="521" x2="838" y2="521" marker-end="url(#gf-arrow)"/>
  <text class="field" x="695" y="504" text-anchor="middle" font-size="21">DARKNESS</text>
  <text class="gk"   x="1095" y="519" text-anchor="middle" font-size="30">ἡ σκοτία</text>
  <text class="note" x="1095" y="549" text-anchor="middle" font-size="21">now a darkness set <tspan font-style="italic">against</tspan> God</text>

  <!-- Row 3 — SHINE (baseline ~ 656) -->
  <text class="ink"  x="330" y="656" text-anchor="middle" font-size="26">and there was light</text>
  <text class="note" x="330" y="684" text-anchor="middle" font-size="21">the light appears in the beginning</text>
  <line class="cross" x1="560" y1="656" x2="838" y2="656" marker-end="url(#gf-arrow)"/>
  <text class="field" x="695" y="639" text-anchor="middle" font-size="21">SHINE</text>
  <text class="gk"   x="1095" y="654" text-anchor="middle" font-size="30">φαίνει</text>
  <text class="note" x="1095" y="684" text-anchor="middle" font-size="21">shines now — the present tense</text>

  <!-- transposition caption inside frame, low -->
  <text class="lbl" x="720" y="728" text-anchor="middle" font-size="21">the christological transposition — Genesis 1, read in the key of the Word</text>

  <!-- ================= third-engagement band (below frame) ================= -->
  <line class="axis" x1="360" y1="826" x2="1080" y2="826"/>

  <!-- 1:1 — first engagement -->
  <circle class="node" cx="360" cy="826" r="7"/>
  <text class="lbl" x="360" y="804" text-anchor="middle" font-size="21">1:1</text>
  <text class="note" x="360" y="860" text-anchor="middle" font-size="21">in the beginning</text>

  <!-- 1:3 — second engagement -->
  <circle class="node" cx="620" cy="826" r="7"/>
  <text class="lbl" x="620" y="804" text-anchor="middle" font-size="21">1:3</text>
  <text class="note" x="620" y="860" text-anchor="middle" font-size="21">all things through him</text>

  <!-- 1:4–5 — the third, this unit (emphasis) -->
  <circle class="gring" cx="1080" cy="826" r="16"/>
  <circle class="gnode" cx="1080" cy="826" r="9"/>
  <text class="head" x="1080" y="800" text-anchor="middle" font-size="21">1:4–5</text>
  <text class="lbl" x="1080" y="860" text-anchor="middle" font-size="21">this unit · the third return</text>

  <text class="note" x="720" y="898" text-anchor="middle" font-size="21">the third sustained engagement with Genesis 1:1–5 in the space of five verses</text>
</svg>
