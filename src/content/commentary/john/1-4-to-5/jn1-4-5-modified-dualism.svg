<svg viewBox="0 0 1440 730" xmlns="http://www.w3.org/2000/svg"
     role="img" aria-labelledby="mdTitle mdDesc" preserveAspectRatio="xMidYMid meet">
  <title id="mdTitle">The modified, non-ultimate dualism of John 1:5 — the darkness real but bounded, read on three registers, with the light shining within it.</title>
  <desc id="mdDesc">Into what does the light shine? Into ἡ σκοτία, the darkness — the fallen human condition, read at once on three registers: cosmological (the created order under the absence of light), moral (the darkness of sin, a turning from God), and noetic (ignorance and unbelief, not knowing its Maker), the noetic register foregrounded. The light shines within the darkness: the preposition ἐν is locative, the sphere the light inhabits, not directional, not a hostile object struck at from outside. The darkness is bounded and non-ultimate: not an eternal counter-principle and not a Gnostic realm — a modified, not a metaphysical, dualism. Three scholarly guards hold that boundary: Bultmann (a revolt against the light, not a substance), Dodd (the darkness of 1:5 is not ultimate), and Lincoln (John placed within a developed Jewish contrast that is already a modified dualism, God ultimately in control) — the first two by exclusion, the third by positive placement.</desc>

  <style>
    /* family theming interface — light page from in-file fallbacks; dark slide when the host sets the tokens */
    .gk    { font-family:'SBL BibLit','Cardo','Gentium Plus','Charis SIL','Source Serif 4',Georgia,serif; fill:currentColor; }
    .ink   { font-family:'Source Serif 4','EB Garamond',Georgia,'Times New Roman',serif; fill:currentColor; }
    .lbl   { font-family:'Source Serif 4','EB Garamond',Georgia,'Times New Roman',serif; fill:var(--color-meta,#6b6b6b); }
    .note  { font-family:'Source Serif 4','EB Garamond',Georgia,'Times New Roman',serif; fill:var(--color-meta,#6b6b6b); font-style:italic; }
    .head  { font-family:'Source Serif 4','EB Garamond',Georgia,'Times New Roman',serif; fill:var(--color-goldtext,#8a6608); letter-spacing:0.16em; }
    .reglbl{ font-family:'Source Serif 4','EB Garamond',Georgia,'Times New Roman',serif; fill:var(--color-goldtext,#8a6608); letter-spacing:0.18em; }
    .neg   { font-family:'Source Serif 4','EB Garamond',Georgia,'Times New Roman',serif; fill:var(--color-meta,#6b6b6b); }

    .box   { stroke:currentColor; stroke-width:2; fill:none; }
    .bound { stroke:var(--color-gold,#b8860b); stroke-width:3.4; fill:none; stroke-linecap:round; }
    .card  { stroke:var(--color-meta,#6b6b6b); stroke-width:1.3; fill:none; }
    .ray   { stroke:var(--color-gold,#b8860b); stroke-width:2; stroke-linecap:round; }
    .lnode { fill:var(--color-gold,#b8860b); }
    .rfill { fill:var(--color-gold,#b8860b); }
    .rring { fill:none; stroke:currentColor; stroke-width:1.8; }
    .strk  { stroke:var(--color-meta,#6b6b6b); stroke-width:1.6; stroke-linecap:round; }
  </style>

  <!-- ============ title block (family form; min-21 re-author, 26 Aug 2026) ============ -->
  <text class="ink" x="90" y="74"  font-size="36">The Modified Dualism</text>
  <text class="lbl" x="90" y="108" font-size="22">John 1:5 · a real darkness, bounded and non-ultimate — the light shining within it</text>

  <!-- ================= the bounded darkness ================= -->
  <rect class="box" x="110" y="170" width="620" height="470" rx="10"/>

  <text class="gk"  x="150" y="224" font-size="34">ἡ σκοτία</text>
  <text class="lbl" x="152" y="254" font-size="21">the darkness — the fallen human condition</text>

  <!-- three registers -->
  <!-- cosmological -->
  <circle class="rring" cx="164" cy="316" r="7"/>
  <text class="reglbl" x="186" y="313" font-size="21">COSMOLOGICAL</text>
  <text class="note"   x="186" y="341" font-size="21">the created order under the absence of light</text>
  <!-- moral -->
  <circle class="rring" cx="164" cy="406" r="7"/>
  <text class="reglbl" x="186" y="403" font-size="21">MORAL</text>
  <text class="note"   x="186" y="431" font-size="21">the darkness of sin — a turning from God</text>
  <!-- noetic (foregrounded) -->
  <circle class="rfill" cx="164" cy="496" r="7.5"/>
  <text class="reglbl" x="186" y="493" font-size="21">NOETIC</text>
  <text class="note"   x="186" y="521" font-size="21">ignorance and unbelief — not knowing its Maker</text>
  <text class="lbl"    x="186" y="549" font-size="21" font-style="italic" letter-spacing="0.04em">the register foregrounded here</text>

  <!-- the light shining within (locative ἐν) -->
  <text class="gk" x="640" y="310" text-anchor="middle" font-size="24" style="fill:var(--color-goldtext,#8a6608)">ἐν τῇ σκοτίᾳ</text>
  <text class="gk"   x="640" y="344" text-anchor="middle" font-size="24">τὸ φῶς</text>
  <g class="ray">
    <line x1="660" y1="384" x2="678" y2="384"/>
    <line x1="654" y1="370" x2="667" y2="360"/>
    <line x1="640" y1="364" x2="640" y2="349"/>
    <line x1="626" y1="370" x2="613" y2="360"/>
    <line x1="620" y1="384" x2="602" y2="384"/>
    <line x1="626" y1="398" x2="613" y2="408"/>
    <line x1="640" y1="404" x2="640" y2="419"/>
    <line x1="654" y1="398" x2="667" y2="408"/>
  </g>
  <circle class="lnode" cx="640" cy="384" r="14"/>
  <text class="gk"   x="640" y="454" text-anchor="middle" font-size="24">φαίνει</text>
  <text class="note" x="640" y="482" text-anchor="middle" font-size="21">within (ἐν), not at it</text>

  <!-- identity line, box floor -->
  <line class="strk" x1="150" y1="576" x2="690" y2="576" style="stroke-width:1; opacity:0.5"/>
  <text class="note" x="420" y="608" text-anchor="middle" font-size="21">a humanity turned from God — a mode of existence, not a cosmic stuff</text>

  <!-- ================= the bound + what the darkness is NOT ================= -->
  <!-- the bound: the box's right edge, marked as the theological limit -->
  <line class="bound" x1="748" y1="162" x2="748" y2="620"/>
  <text class="head" x="748" y="146" text-anchor="middle" font-size="21">THE BOUND</text>
  <text class="lbl"  x="768" y="646" font-size="21">a limit — the darkness is not ultimate</text>

  <text class="head" x="1095" y="214" text-anchor="middle" font-size="21">WHAT THE DARKNESS IS NOT</text>

  <!-- exclusion 1 -->
  <text class="ink" x="800" y="300" font-size="24">not <tspan class="neg">an eternal counter-principle</tspan></text>
  <line class="strk" x1="858" y1="292" x2="1224" y2="292"/>
  <text class="note" x="800" y="330" font-size="21">no co-eternal rival, equal-and-opposite to the light</text>

  <!-- exclusion 2 -->
  <text class="ink" x="800" y="404" font-size="24">not <tspan class="neg">a Gnostic realm</tspan></text>
  <line class="strk" x1="858" y1="396" x2="1084" y2="396"/>
  <text class="note" x="800" y="434" font-size="21">no separate world or substance of its own</text>

  <!-- the positive summary of the bound -->
  <line class="card" x1="800" y1="486" x2="1360" y2="486"/>
  <text class="reglbl" x="800" y="524" font-size="21">A MODIFIED, NOT A METAPHYSICAL, DUALISM</text>
  <text class="note"   x="800" y="552" font-size="21">the bounded, non-ultimate state of the creature — not the light's equal</text>

  <!-- movement summary -->
  <text class="note" x="720" y="698" text-anchor="middle" font-size="21">a real darkness, but bounded and non-ultimate — the light shines within it, and the dark remains dark</text>
</svg>
