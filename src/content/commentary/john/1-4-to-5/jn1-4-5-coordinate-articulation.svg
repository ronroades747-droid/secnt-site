<svg viewBox="0 0 1440 1100" xmlns="http://www.w3.org/2000/svg"
     role="img" aria-labelledby="caTitle caDesc" preserveAspectRatio="xMidYMid meet">
  <title id="caTitle">The coordinate articulation of John 1:4–5 — the gradatio and the macro-tense run as two dimensions of one composition on the same four treads.</title>
  <desc id="caDesc">The four clauses of John 1:4–5 stand as a four-step staircase, one clause per tread, climbing from the life in the Word at the bottom to the darkness's failure at the top. The same four treads are read along two axes, held co-primary. Read as shape — the synchronic, rhetorical gradatio — each step takes up the last significant term of the step before: life is carried up to light, light up to darkness, so the terms climb life to light to darkness to the darkness's failure. Read as time — the diachronic, temporal macro-tense run — the verbs move imperfect, imperfect at verse 4, then the present at verse 5a, then the aorist at verse 5b: an eternal ground in the imperfect, the marked present that breaks the imperfect chain and sets the unit's time, and the constative aorist that sums the darkness's failure as one finished fact. The unit's run instantiates the Prologue's macro-tense spine, was, came-to-be, has-come-to-be. The two readings are not two arguments for one conclusion but one composition seen along two axes; neither is reducible to the other and neither leans on the other's ground.</desc>

  <style>
    /* --- family theming interface: light page renders from in-file fallbacks;
           dark slide renders when the host sets color / --color-gold / --color-meta / --color-goldtext --- */
    .gk    { font-family:'SBL BibLit','Cardo','Gentium Plus','Charis SIL','Source Serif 4',Georgia,serif; fill:currentColor; }
    .ink   { font-family:'Source Serif 4','EB Garamond',Georgia,'Times New Roman',serif; fill:currentColor; }
    .lbl   { font-family:'Source Serif 4','EB Garamond',Georgia,'Times New Roman',serif; fill:var(--color-meta,#6b6b6b); }
    .note  { font-family:'Source Serif 4','EB Garamond',Georgia,'Times New Roman',serif; fill:var(--color-meta,#6b6b6b); font-style:italic; }
    .disc  { font-family:'Source Serif 4','EB Garamond',Georgia,'Times New Roman',serif; fill:var(--color-goldtext,#8a6608); letter-spacing:2.5px; }
    .eye   { font-family:'Source Serif 4','EB Garamond',Georgia,'Times New Roman',serif; fill:var(--color-goldtext,#8a6608); letter-spacing:4px; }

    .cw    { fill:var(--color-goldtext,#8a6608); }               /* catchword lemma inside a clause */
    .vf    { text-decoration:underline; text-decoration-color:currentColor; text-underline-offset:4px; text-decoration-thickness:2px; } /* verb-form (the tense datum) */

    .box   { fill:none; stroke:currentColor; stroke-width:2; }
    .rule  { stroke:var(--color-gold,#b8860b); stroke-width:2.4; fill:none; stroke-linecap:round; }
    .spine { stroke:var(--color-gold,#b8860b); stroke-width:2.6; fill:none; stroke-linejoin:round; stroke-linecap:round; }
    .ctie  { stroke:var(--color-gold,#b8860b); stroke-width:2.2; fill:none; stroke-linecap:round; } /* catchword tie (synchronic) */
    .drun  { stroke:currentColor; stroke-width:1.5; fill:none; stroke-linecap:round; }              /* node→tread tie (diachronic) */
    .node  { fill:var(--color-gold,#b8860b); }
    .ring  { fill:none; stroke:var(--color-gold,#b8860b); stroke-width:2; }
    .oring { fill:none; stroke:var(--color-gold,#b8860b); stroke-width:1.8; }
    .tick  { stroke:var(--color-meta,#6b6b6b); stroke-width:1.1; fill:none; }
  </style>

  <defs>
    <marker id="ca-gold" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--color-gold,#b8860b)"/>
    </marker>
  </defs>

  <!-- ============ title block + co-primary thesis (family form; min-21 re-author, 26 Aug 2026) ============ -->
  <text class="ink" x="90" y="74"  font-size="36">The Coordinate Articulation</text>
  <text class="lbl" x="90" y="108" font-size="22">John 1:4–5 · one composition, two dimensions</text>
  <text class="note" x="720" y="144" text-anchor="middle" font-size="21">the gradatio — synchronic, rhetorical shape — and the macro-tense run — diachronic, temporal shape — trace the same four treads;</text>
  <text class="note" x="720" y="172" text-anchor="middle" font-size="21">co-primary: neither reducible to the other, neither leaning on the other's ground.</text>

  <!-- ===================== the four treads (shared substrate) ===================== -->
  <!-- geometry reused from the Gradatio Staircase (Diagram 02), shifted +40 for the title block, so 02 and 05 read as one hand -->

  <!-- T1 · v.4a · ONTOLOGY -->
  <rect class="box" x="90"  y="740" width="540" height="120" rx="10"/>
  <text class="lbl"  x="112" y="772" font-size="21">v. 4a</text>
  <text class="disc" x="608" y="772" text-anchor="end" font-size="21">ONTOLOGY</text>
  <text class="gk"   x="360" y="816" text-anchor="middle" font-size="26">ἐν αὐτῷ <tspan class="cw">ζωὴ</tspan> <tspan class="vf">ἦν</tspan></text>
  <text class="note" x="360" y="846" text-anchor="middle" font-size="21">in him was life</text>
  <circle class="ring" cx="90" cy="800" r="17"/>
  <text class="disc" x="90" y="807" text-anchor="middle" font-size="21" letter-spacing="0">1</text>

  <!-- T2 · v.4b · ANTHROPOLOGY -->
  <rect class="box" x="340" y="560" width="540" height="120" rx="10"/>
  <text class="lbl"  x="362" y="592" font-size="21">v. 4b</text>
  <text class="disc" x="858" y="592" text-anchor="end" font-size="21">ANTHROPOLOGY</text>
  <text class="gk"   x="610" y="636" text-anchor="middle" font-size="26">καὶ ἡ <tspan class="cw">ζωὴ</tspan> <tspan class="vf">ἦν</tspan> τὸ <tspan class="cw">φῶς</tspan> τῶν ἀνθρώπων</text>
  <text class="note" x="610" y="666" text-anchor="middle" font-size="21">the life, the light of humanity</text>
  <circle class="ring" cx="340" cy="620" r="17"/>
  <text class="disc" x="340" y="627" text-anchor="middle" font-size="21" letter-spacing="0">2</text>

  <!-- T3 · v.5a · COSMOLOGY -->
  <rect class="box" x="590" y="380" width="540" height="120" rx="10"/>
  <text class="lbl"  x="612" y="412" font-size="21">v. 5a</text>
  <text class="disc" x="1108" y="412" text-anchor="end" font-size="21">COSMOLOGY</text>
  <text class="gk"   x="860" y="456" text-anchor="middle" font-size="26">καὶ τὸ <tspan class="cw">φῶς</tspan> ἐν τῇ <tspan class="cw">σκοτίᾳ</tspan> <tspan class="vf">φαίνει</tspan></text>
  <text class="note" x="860" y="486" text-anchor="middle" font-size="21">the light shines in the darkness</text>
  <circle class="ring" cx="590" cy="440" r="17"/>
  <text class="disc" x="590" y="447" text-anchor="middle" font-size="21" letter-spacing="0">3</text>

  <!-- T4 · v.5b · SOTERIOLOGY -->
  <rect class="box" x="840" y="200" width="540" height="120" rx="10"/>
  <text class="lbl"  x="862" y="232" font-size="21">v. 5b</text>
  <text class="disc" x="1358" y="232" text-anchor="end" font-size="21">SOTERIOLOGY</text>
  <text class="gk"   x="1110" y="276" text-anchor="middle" font-size="26">καὶ ἡ <tspan class="cw">σκοτία</tspan> αὐτὸ οὐ <tspan class="vf">κατέλαβεν</tspan></text>
  <text class="note" x="1110" y="306" text-anchor="middle" font-size="21">the darkness did not overcome it</text>
  <circle class="ring" cx="840" cy="260" r="17"/>
  <text class="disc" x="840" y="267" text-anchor="middle" font-size="21" letter-spacing="0">4</text>

  <!-- ===================== SYNCHRONIC register: the gradatio (catchword ties on the risers) ===================== -->
  <!-- vertical ascent arrow = the synchronic axis (the shape climbs) -->
  <path class="rule" d="M46 746 L46 340" marker-end="url(#ca-gold)"/>

  <!-- catchword ties bridging the risers, each carrying the last term of the lower tread up to the next -->
  <path class="ctie" d="M416 740 C430 718 434 702 447 682" marker-end="url(#ca-gold)"/>
  <text class="disc" x="470" y="718" font-size="24" letter-spacing="0"><tspan class="gk cw">ζωή</tspan></text>

  <path class="ctie" d="M716 560 C730 538 734 522 747 502" marker-end="url(#ca-gold)"/>
  <text class="disc" x="770" y="538" font-size="24" letter-spacing="0"><tspan class="gk cw">φῶς</tspan></text>

  <path class="ctie" d="M996 380 C1010 358 1014 342 1027 322" marker-end="url(#ca-gold)"/>
  <text class="disc" x="1050" y="358" font-size="24" letter-spacing="0"><tspan class="gk cw">σκοτία</tspan></text>

  <!-- synchronic register label (upper-left flank) -->
  <text class="eye"  x="64" y="380" font-size="21">READ AS SHAPE</text>
  <text class="ink"  x="64" y="410" font-size="22">the gradatio · synchronic</text>
  <text class="note" x="64" y="440" font-size="21">each step takes up the last</text>
  <text class="note" x="64" y="466" font-size="21">significant term of the one before —</text>
  <text class="note" x="64" y="496" font-size="21">life → light → darkness →</text>
  <text class="note" x="64" y="522" font-size="21">the darkness's failure</text>

  <!-- ===================== DIACHRONIC register: the macro-tense run (spine in the lower-right) ===================== -->
  <!-- the spine = the diachronic axis (time runs forward) -->
  <path class="spine" d="M690 920 L925 752 L1160 588 L1355 438" marker-end="url(#ca-gold)"/>

  <!-- node → tread ties -->
  <path class="drun" d="M690 920 L630 860"/>
  <path class="drun" d="M925 752 L880 680"/>
  <path class="drun" d="M1160 588 L1130 500"/>
  <path class="drun" d="M1355 438 L1380 320"/>

  <!-- nodes + tense tags -->
  <circle class="node" cx="690"  cy="920" r="6"/>
  <text class="lbl" x="672" y="948" text-anchor="end" font-size="21">imperfect</text>

  <circle class="node" cx="925"  cy="752" r="6"/>
  <text class="lbl" x="956" y="748" font-size="21">imperfect</text>

  <!-- v.5a present: the rupture — the Prologue's first present indicative (marked with a gold ring) -->
  <circle class="oring" cx="1160" cy="588" r="13"/>
  <circle class="node"  cx="1160" cy="588" r="6"/>
  <text class="disc" x="1191" y="584" font-size="21" letter-spacing="0">present</text>
  <text class="note" x="1129" y="558" text-anchor="end" font-size="21">the first present — it breaks the chain,</text>
  <text class="note" x="1129" y="584" text-anchor="end" font-size="21">and sets the unit's time</text>

  <circle class="node" cx="1355" cy="438" r="6"/>
  <text class="lbl" x="1324" y="432" text-anchor="end" font-size="21">aorist</text>
  <text class="note" x="1324" y="458" text-anchor="end" font-size="21">one finished fact</text>

  <!-- diachronic register label (lower band, right of the spine's foot) -->
  <text class="eye"  x="748" y="1008" font-size="21">READ AS TIME</text>
  <text class="ink"  x="748" y="1038" font-size="22">the macro-tense run · diachronic</text>
  <text class="note" x="748" y="1066" font-size="21">eternal ground → present shining → completed failure</text>

  <!-- the Prologue-spine instantiation (bottom-left, below T1) -->
  <text class="note" x="110" y="938" font-size="21">the unit's run instantiates the Prologue's</text>
  <text class="note" x="110" y="964" font-size="21">macro-tense spine —</text>
  <text class="gk"   x="110" y="996" font-size="22">ἦν · ἐγένετο · ὃ γέγονεν</text>

  <!-- ===================== unit signature ===================== -->
  <text class="eye" x="720" y="1092" text-anchor="middle" font-size="21">THE UNIT'S DELIBERATE COMPOSITION</text>
</svg>
