# SECNT — the scheduled publish build (Plan D33, 10 September 2026).
# Deploy:  npx wrangler deploy
# Secret:  npx wrangler secret put DEPLOY_HOOK_URL
# Dry run: npx wrangler dev  then
#          curl "http://localhost:8787/cdn-cgi/local/scheduled?format=json"

name = "secnt-publish-cron"
main = "worker.js"
compatibility_date = "2026-09-10"

# No workers.dev subdomain. Without this the first deploy publishes
# secnt-publish-cron.<subdomain>.workers.dev, which serves nothing — there is
# no fetch handler — but is a live public URL on the account for a Worker that
# has no business being reachable. Set false so the closing note below stays
# true. (Removing it later requires a redeploy, not just a dashboard change.)
workers_dev = false

# Persist this Worker's logs to the dashboard. Without this a failed run is an
# exception COUNT on the metrics page and nothing more: the run of 12 September
# 2026 threw, the console line naming the reason was written and discarded, and
# the cause had to be inferred from a subrequest count of zero. The setting
# lives here rather than on the dashboard toggle because `wrangler deploy`
# overwrites what the toggle sets. One run a day against a free-plan allowance
# of 200,000 events, so the sampling rate is 1 and no run is ever thinned out.
[observability]
enabled = true
head_sampling_rate = 1

[triggers]
# 12:00 UTC daily = 08:00 America/New_York in EDT, 07:00 in EST.
# Cloudflare cron expressions are UTC; the hour is not DST-corrected by
# ruling, and the drift is always earlier, never later.
crons = ["0 12 * * *"]

# No routes, no workers.dev subdomain, no fetch handler: this Worker is not
# reachable over HTTP at all. It exists only to be woken by the cron above.
